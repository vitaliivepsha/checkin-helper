# fly.toml app configuration file generated for checkin-helper on 2026-05-18T19:38:11+02:00

app = 'checkin-helper'
primary_region = 'fra'

[build]

[env]
  BOT_DATA_DIR = '/data'
  BOT_TIMEZONE = 'Europe/Warsaw'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = 'bot_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

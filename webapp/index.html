<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Festival Check-in</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="/static/checkin/style.css">
</head>
<body>

<!-- Single source of truth for every icon shape - both this file's own
     static buttons AND app.js's dynamically-built row/button HTML reference
     these by id via <use>, so redrawing a shape here updates it everywhere
     at once (previously each was hand-copied into 2-3 places separately -
     see the icon catalog artifact from this session for the full audit). -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="icon-coffee" viewBox="0 0 24 24"><rect x="5" y="8" width="12" height="14" rx="2"/><path d="M17 11h2a2 2 0 0 1 0 4h-2M8 4v3M12 5v2M16 4v3"/></symbol>
  <symbol id="icon-bar-chart" viewBox="0 0 24 24"><rect x="4" y="14" width="4" height="6" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="16" y="2" width="4" height="18" rx="1"/></symbol>
  <symbol id="icon-clipboard-list" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M12 11h4M12 16h4M8 11h.01M8 16h.01"/></symbol>
  <symbol id="icon-cheers" viewBox="0 0 24 24"><path d="M14 5l1.5 4.5a3 3 0 0 0 5.66 0L22.66 5ZM18.33 12.5V18M15 18h6.66M2 7l1.5 4.5a3 3 0 0 0 5.66 0L10.66 7ZM6.33 14.5V20M3 20h6.66"/></symbol>
  <symbol id="icon-sparkle" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></symbol>
  <symbol id="icon-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></symbol>
  <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.37a2 2 0 0 1-1.27 1.27L6.48 17.52l2.12-6.37a2 2 0 0 1 1.27-1.27l6.37-2.12z"/></symbol>
  <symbol id="icon-external-link" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></symbol>
  <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="icon-tent" viewBox="0 0 24 24"><path d="M19 20 10 4M5 20l9-16M3 20h18M12 15l-3 5M12 15l3 5"/></symbol>
  <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.99-5.54 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.2 4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-10h6v10"/></symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
  <symbol id="icon-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
  <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></symbol>
  <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="icon-grip" viewBox="0 0 24 24"><circle cx="9" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="19" r="1.6"/></symbol>
  <!-- Drawn as a real teardrop (narrow tip, belly low, round bottom) and
       always used FILLED (.icon-filled): the water mark rides on a brewery
       pill at ~12px, where a stroked outline reads as a blob. -->
  <symbol id="icon-droplet" viewBox="0 0 24 24"><path d="M12 2.6c2.6 4.1 7.4 8.1 7.4 12.2a7.4 7.4 0 0 1-14.8 0C4.6 10.7 9.4 6.7 12 2.6Z"/><path d="M8.6 15.4a3.4 3.4 0 0 0 2.9 3" style="fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;opacity:.6"/></symbol>
  <symbol id="icon-align-left" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></symbol>
  <symbol id="icon-align-center" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M5.5 18h13"/></symbol>
  <symbol id="icon-align-right" viewBox="0 0 24 24"><path d="M4 6h16M10 12h10M7 18h13"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <!-- The app's own mark (the purple glass + check pin). Defined once here
       and <use>d by the search screen's idle hero AND the "Автоматично"
       tile on "Мій фестиваль" - it carries its own fills, so it is NOT one
       of the currentColor .icon shapes above. -->
  <symbol id="app-mark" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#7c5cfc"/>
    <path d="M 140 450 H 372 V 440 C 340 420 300 415 272 415 V 330 H 240 V 415 C 212 415 172 420 140 440 Z" fill="#ffffff"/>
    <circle cx="256" cy="375" r="28" fill="#ffffff"/>
    <path d="M 120 160 C 120 320 186 345 256 345 C 326 345 392 320 392 160 Z" fill="#ffffff"/>
    <path d="M 140 210 C 148 305 200 325 256 325 C 312 325 364 305 372 210 Z" fill="#462b9c"/>
    <path d="M 154 220 C 164 275 186 305 216 315" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
    <path d="M 358 220 C 354 245 342 270 320 295" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
    <circle cx="210" cy="285" r="9" fill="#ffffff" opacity="0.6"/>
    <circle cx="260" cy="255" r="14" fill="#ffffff" opacity="0.5"/>
    <circle cx="295" cy="295" r="7" fill="#ffffff" opacity="0.6"/>
    <circle cx="230" cy="230" r="8" fill="#ffffff" opacity="0.7"/>
    <circle cx="256" cy="130" r="55" fill="#ffffff"/>
    <circle cx="195" cy="145" r="45" fill="#ffffff"/>
    <circle cx="317" cy="145" r="45" fill="#ffffff"/>
    <circle cx="145" cy="170" r="35" fill="#ffffff"/>
    <circle cx="367" cy="170" r="35" fill="#ffffff"/>
    <path d="M 160 170 Q 170 225 190 215 Q 210 190 220 170 Z" fill="#ffffff"/>
    <path d="M 352 170 Q 342 225 322 215 Q 302 190 292 170 Z" fill="#ffffff"/>
    <path d="M 350 435 C 350 435 285 355 285 310 A 65 65 0 1 1 415 310 C 415 355 350 435 350 435 Z" fill="#ffffff" stroke="#6143cc" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="350" cy="310" r="40" fill="#7c5cfc"/>
    <path d="M 335 313 L 346 324 L 368 299" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-user-check" viewBox="0 0 24 24"><circle cx="10" cy="7.5" r="4"/><path d="M3 21v-1a6 6 0 0 1 6-6h2.5"/><path d="m15 18 2.2 2.2L22 15.5"/></symbol>
  <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.2 9h17.6M3.2 15h17.6"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18Z"/></symbol>
  <symbol id="icon-beer" viewBox="0 0 24 24"><path d="M5 7h10v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2zM15 10h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2M8 11v6M12 11v6M5 7a2.5 2.5 0 0 1 2.2-3.7 3 3 0 0 1 5.6 0A2.5 2.5 0 0 1 15 7"/></symbol>
  <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
  <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="icon-alert-triangle" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0ZM12 9v4M12 17h.01"/></symbol>
</svg>

<!-- Global maintenance splash (app.js checks /api/checkin/maintenance/get
     once on load) - hidden by default, shown full-screen on top of
     everything else while the owner has /maintenance on toggled. Sits
     outside every .screen so showScreen()'s own show/hide logic never
     touches it. -->
<div id="maintenance-overlay" class="maintenance-overlay hidden">
  <div class="maintenance-card">
    <div class="maintenance-icon"><svg class="icon"><use href="#icon-refresh"/></svg></div>
    <div class="maintenance-title" data-i18n="app_maint_title"></div>
    <div class="maintenance-message" id="maintenance-message" data-i18n="app_maint_msg"></div>
  </div>
</div>

<div id="screen-search" class="screen active">
  <div class="topbar">
    <div class="topbar-top-row">
      <div class="topbar-title">
        <div class="app-title" data-i18n="app_title"></div>
        <!-- Filled in by app.js once /api/checkin/usage answers; stays
             empty (and collapses) until then. -->
        <div class="usage-badge hidden" id="usage-wrap">
          <svg class="usage-ring" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" class="usage-ring-track"/>
            <circle cx="12" cy="12" r="9" class="usage-ring-fill" id="usage-ring-fill"/>
          </svg>
          <span id="usage-badge"></span>
        </div>
        <!-- Owner-only: the separate direct-Untappd-API quota (see
             webapp_server.py's handle_usage) - absent for everyone else. -->
        <div class="usage-badge hidden" id="direct-usage-wrap">
          <svg class="usage-ring" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" class="usage-ring-track"/>
            <circle cx="12" cy="12" r="9" class="usage-ring-fill" id="direct-usage-ring-fill"/>
          </svg>
          <span id="direct-usage-badge"></span>
        </div>
        <!-- Tap the direct-quota badge: who spent it (see app.js). -->
        <div class="direct-breakdown hidden" id="direct-usage-breakdown"></div>
      </div>
      <button id="events-bar-btn" class="icon-btn" data-i18n-title="app_events_title" data-i18n-aria="app_events_title">
        <svg class="icon"><use href="#icon-bell"/></svg>
      </button>
      <button id="settings-bar-btn" class="icon-btn" data-i18n-title="app_settings" data-i18n-aria="app_settings">
        <svg class="icon"><use href="#icon-settings"/></svg>
      </button>
    </div>
  </div>
  <input id="search-input" type="text" inputmode="search"
         data-i18n-placeholder="app_search_placeholder" autocomplete="off">
  <div class="search-filters">
    <label class="checkbox-label hidden" id="festival-priority-label">
      <input type="checkbox" id="festival-priority-checkbox" checked> <span data-i18n="app_festival_list"></span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="wishlist-priority-checkbox"> <span data-i18n="app_wishlist_word"></span>
    </label>
  </div>
  <div id="search-status" class="hint"></div>
  <!-- Idle empty-state illustration - hidden as soon as there's a real
       query (see app.js's search-input handler), shown again once cleared.
       Two colorways, one per theme (default purple / festival orange),
       toggled by the same body.festival-mode-active class everything
       else already themes off - see style.css. -->
  <div class="home-hero" id="home-hero">
    <svg class="home-hero-icon home-hero-icon-default" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <use href="#app-mark"/>
    </svg>
    <svg class="home-hero-icon home-hero-icon-festival" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="112" fill="#f39c12"/>
      <path d="M 140 450 H 372 V 440 C 340 420 300 415 272 415 V 330 H 240 V 415 C 212 415 172 420 140 440 Z" fill="#1a1300"/>
      <circle cx="256" cy="375" r="28" fill="#1a1300"/>
      <path d="M 120 160 C 120 320 186 345 256 345 C 326 345 392 320 392 160 Z" fill="#1a1300"/>
      <path d="M 140 210 C 148 305 200 325 256 325 C 312 325 364 305 372 210 Z" fill="#e08600"/>
      <path d="M 154 220 C 164 275 186 305 216 315" fill="none" stroke="#f39c12" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
      <path d="M 358 220 C 354 245 342 270 320 295" fill="none" stroke="#f39c12" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
      <circle cx="210" cy="285" r="9" fill="#1a1300" opacity="0.4"/>
      <circle cx="260" cy="255" r="14" fill="#1a1300" opacity="0.25"/>
      <circle cx="295" cy="295" r="7" fill="#1a1300" opacity="0.35"/>
      <circle cx="230" cy="230" r="8" fill="#1a1300" opacity="0.45"/>
      <circle cx="256" cy="130" r="55" fill="#1a1300"/>
      <circle cx="195" cy="145" r="45" fill="#1a1300"/>
      <circle cx="317" cy="145" r="45" fill="#1a1300"/>
      <circle cx="145" cy="170" r="35" fill="#1a1300"/>
      <circle cx="367" cy="170" r="35" fill="#1a1300"/>
      <path d="M 160 170 Q 170 225 190 215 Q 210 190 220 170 Z" fill="#1a1300"/>
      <path d="M 352 170 Q 342 225 322 215 Q 302 190 292 170 Z" fill="#1a1300"/>
      <path d="M 350 435 C 350 435 285 355 285 310 A 65 65 0 1 1 415 310 C 415 355 350 435 350 435 Z" fill="#1a1300" stroke="#8c5a00" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="350" cy="310" r="40" fill="#f39c12"/>
      <path d="M 335 313 L 346 324 L 368 299" fill="none" stroke="#1a1300" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="results" class="results"></div>
</div>

<div id="screen-queue" class="screen">
  <button class="back-btn" data-back="search" data-i18n="app_back"></button>
  <!-- Shown only while festival mode is on (CSS keys off
       body.festival-mode-active) - same reminder as the settings row. -->
  <div class="festival-banner">
    <span class="festival-banner-icon"><svg class="icon"><use href="#icon-tent"/></svg></span>
    <div>
      <div class="festival-banner-title">Festival mode</div>
      <div class="festival-banner-text" data-i18n="app_festival_banner"></div>
    </div>
  </div>
  <div class="queue-header" id="queue-header-normal">
    <div>
      <h2 data-i18n="app_queue_title"></h2>
      <div class="screen-subtitle" id="queue-subtitle"></div>
    </div>
    <button id="queue-clear-btn" class="queue-clear-btn">
      <svg class="icon"><use href="#icon-trash"/></svg>
      <span data-i18n="app_clear"></span>
    </button>
  </div>
  <div class="queue-header selection-bar hidden" id="queue-selection-bar">
    <span id="queue-selection-count"></span>
    <div class="selection-bar-actions">
      <button id="queue-selection-delete-btn" class="queue-clear-btn">
        <svg class="icon"><use href="#icon-trash"/></svg>
        <span data-i18n="app_delete"></span>
      </button>
      <button id="queue-selection-cancel-btn" class="queue-clear-btn" data-i18n="app_cancel"></button>
    </div>
  </div>
  <div id="queue-status" class="hint"></div>
  <div id="queue-list" class="results"></div>
  <div class="hint queue-select-hint hidden" id="queue-select-hint" data-i18n="app_queue_hold_hint"></div>
</div>

<div id="screen-wishlist" class="screen">
  <button class="back-btn" data-back="search" data-i18n="app_back"></button>
  <div class="queue-header" id="wishlist-header-normal">
    <h2 data-i18n="app_wishlist_title"></h2>
  </div>
  <div class="queue-header selection-bar hidden" id="wishlist-selection-bar">
    <span id="wishlist-selection-count"></span>
    <div class="selection-bar-actions">
      <button id="wishlist-selection-delete-btn" class="queue-clear-btn">
        <svg class="icon"><use href="#icon-trash"/></svg>
        <span data-i18n="app_delete"></span>
      </button>
      <button id="wishlist-selection-cancel-btn" class="queue-clear-btn" data-i18n="app_cancel"></button>
    </div>
  </div>
  <input id="wishlist-search-input" type="text" inputmode="search"
         data-i18n-placeholder="app_wishlist_search_ph" autocomplete="off">
  <div class="pills" id="wishlist-sort-pills">
    <button class="pill active" data-sort="date" data-i18n="app_sort_date"></button>
    <button class="pill" data-sort="alpha" data-i18n="app_sort_name"></button>
    <button class="pill" data-sort="brewery" data-i18n="app_sort_brewery"></button>
    <button class="pill" data-sort="abv">ABV</button>
  </div>
  <div id="wishlist-status" class="hint"></div>
  <div id="wishlist-list" class="results"></div>
</div>

<div id="screen-pending-checkins" class="screen">
  <button class="back-btn" data-back="search" data-i18n="app_back"></button>
  <h2 data-i18n="app_pending_title"></h2>
  <div id="pending-checkins-status" class="hint"></div>
  <div id="pending-checkins-list" class="results"></div>
</div>

<div id="screen-stats" class="screen">
  <button class="back-btn" data-back="search" data-i18n="app_back"></button>
  <h2 data-i18n="app_progress_title"></h2>
  <div id="stats-summary" class="stats-summary hint"></div>
  <div id="stats-sessions" class="results"></div>
</div>

<div id="screen-session-beers" class="screen">
  <button class="back-btn" data-back="stats" data-i18n="app_back"></button>
  <h2 id="session-beers-title" data-i18n="app_session_word"></h2>
  <input id="session-search-input" type="text" inputmode="search"
         data-i18n-placeholder="app_session_search_ph" autocomplete="off">
  <div id="session-beers-status" class="hint"></div>
  <div id="session-beers-list" class="results"></div>
</div>

<div id="screen-autotoast" class="screen">
  <button class="back-btn" data-back="settings" data-i18n="app_back"></button>
  <div class="queue-header">
    <h2 data-i18n="app_autotoast_title"></h2>
    <label class="toggle-switch">
      <input type="checkbox" id="autotoast-enabled-toggle">

<!-- Single shared "..." row menu (search results) - a body-level element,
     not nested inside any .result-row, specifically so a dimmed
     .result-row.had-it's opacity can't bleed into the popup (a child can't
     opt back out of an ancestor's opacity via its own opacity:1 - the only
     real fix is not being a descendant of it). Repositioned/repopulated
     per-row by app.js on each "..." tap. -->
<div id="shared-row-menu" class="row-menu">
  <button id="shared-row-menu-wishlist" class="row-menu-item"></button>
  <button id="shared-row-menu-link" class="row-menu-item">
    <svg class="icon"><use href="#icon-external-link"/></svg>
    <span data-i18n="app_open_in_untappd"></span>
  </button>
</div>

<!-- Bottom tab bar - only the 4 core destinations (icon-on-top, label
     below, evenly split via flex:1 so all 4 always fit with no horizontal
     scroll at any phone width - a scrollable row here had no visible hint
     that it scrolled, confirmed live: 2 of 6 tabs sat completely
     off-screen on a real phone width with zero affordance). Авто-тост and
     Новинки moved into Налаштування (their own settings rows now open the
     full screen on tap - see app.js) since both are otherwise just a
     toggle + one config screen, not core moment-to-moment navigation. -->
<nav class="bottom-nav">
  <button id="home-bar-btn" class="nav-tab active">

    <span class="nav-label" data-i18n="app_nav_search"></span>

    <span class="nav-label" data-i18n="app_nav_progress"></span>
  </button>

    <svg class="icon"><use href="#icon-clipboard-list"/></svg>
    <span class="nav-label" data-i18n="app_wishlist_title"></span>
  </button>

    <span class="nav-icon-wrap">
      <svg class="icon"><use href="#icon-refresh"/></svg>
      <span class="nav-badge" id="pending-checkins-count">0</span>
    </span>
    <span class="nav-label" data-i18n="app_pending_nav"></span>
  </button>
  <button id="badges-bar-btn" class="nav-tab">
    <svg class="icon"><use href="#icon-award"/></svg>
    <span class="nav-label" data-i18n="app_badges_title"></span>

  <button id="festival-map-bar-btn" class="nav-tab hidden">
    <svg class="icon"><use href="#icon-pin"/></svg>
    <span class="nav-label" data-i18n="app_nav_map"></span>
  </button>
</nav>
